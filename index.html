<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Game of Life</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0e1116">

<!-- iPhone ignores most of the manifest, so repeat it here -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Game of Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0e1116;
    color: #e9edf2;
    font: 16px system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  .hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    pointer-events: none;
    z-index: 10
  }

  .hud button {
    pointer-events: auto;
  }

  .menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(14, 17, 22, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  pointer-events: auto;
}

.menu-panel {
  background: #161b22;
  border: 1px solid #262c36;
  border-radius: 14px;
  padding: 28px;
  width: min(320px, 85vw);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.menu-panel h1 {
  margin: 0 0 4px;
  font-size: 20px;
  text-align: center;
}

.menu-group label {
  display: block;
  font-size: 13px;
  color: #9aa4b2;
  margin-bottom: 6px;
}

.btn-row { display: flex; gap: 8px; }

.mode-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #2c3542;
  background: #1c2128;
  color: #e9edf2;
  cursor: pointer;
}

.mode-btn.active {
  background: #6ee7b7;
  color: #0e1116;
  border-color: #6ee7b7;
  font-weight: 600;
}

.menu-group select,
.menu-group input[type="range"] {
  width: 100%;
}

.color-row { display: flex; gap: 16px; }
.color-row > div { flex: 1; }
.color-row input[type="color"] {
  width: 100%;
  height: 36px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
}

.play-btn {
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #6ee7b7;
  color: #0e1116;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}

.hud button {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid #2c3542;
  background: #1c2128;
  color: #e9edf2;
  cursor: pointer;
  font-size: 14px;
}

.secondary-btn {
  background: #1c2128;
  color: #e9edf2;
  border: 1px solid #2c3542;
}
</style>

</head>
<body>

    <!-- MAIN MENU -->
  <div id="mainMenu" class="menu-overlay">
    <div class="menu-panel">
      <h1>The Game of Life</h1>
      <button id="newGameBtn" class="play-btn">New Game</button>
      <button id="resumeBtn" class="play-btn secondary-btn" style="display:none;">Resume Game</button>
      <button id="settingsBtn" class="play-btn secondary-btn">Settings</button>
    </div>
  </div>

  <!-- NEW GAME MENU -->
  <div id="newGameMenu" class="menu-overlay" style="display:none;">
    <div class="menu-panel">
      <h1>New Game</h1>

      <div class="menu-group">
        <label>Start Mode</label>
        <div class="btn-row">
          <button id="modeRandom" class="mode-btn active" data-mode="random">Random</button>
          <button id="modeBlank" class="mode-btn" data-mode="blank">Blank</button>
        </div>
      </div>

      <div class="menu-group">
        <label for="gridSize">Grid Size</label>
        <select id="gridSize">
          <option value="50">Small (50×50)</option>
          <option value="100" selected>Medium (100×100)</option>
          <option value="150">Large (150×150)</option>
        </select>
      </div>

      <button id="playBtn" class="play-btn">▶ Start Game</button>
      <button id="backFromNewGame" class="play-btn secondary-btn">Back</button>
    </div>
  </div>

  <!-- SETTINGS MENU -->
  <div id="settingsMenu" class="menu-overlay" style="display:none;">
    <div class="menu-panel">
      <h1>Settings</h1>

      <div class="menu-group">
        <label for="speedSlider">Speed: <span id="speedVal">10</span> fps</label>
        <input type="range" id="speedSlider" min="1" max="60" value="10">
      </div>

      <div class="menu-group color-row">
        <div>
          <label for="cellColor">Cell Color</label>
          <input type="color" id="cellColor" value="#6ee7b7">
        </div>
        <div>
          <label for="bgColorInput">Background</label>
          <input type="color" id="bgColorInput" value="#0e1116">
        </div>
      </div>

      <button id="backFromSettings" class="play-btn secondary-btn">Back</button>
    </div>
  </div>

  <div class="hud" id="hud" style="display:none;">
    <button id="menuBtn">☰ Back to Menu</button>
    <button id="toggleRun">⏸ Pause</button>
    <button id="settingsBtn" class="play-btn secondary-btn">Settings</button>
    <button id="installBtn" class="play-btn secondary-btn" style="display:none;">⬇ Download for Offline</button>
    <p id="installHint" style="display:none; margin:0; font-size:13px; color:#9aa4b2; text-align:center;">
      On iPhone: tap the Share button, then "Add to Home Screen".
    </p>
  </div>

<script src="/p5.min.js"></script>  
<script src="/game.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</body>
</html>
