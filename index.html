<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Game of Life</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0e1116">

<!-- iPhone ignores most of the manifest, so repeat it here -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Game of Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0e1116;
    color: #e9edf2;
    font: 16px system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  .hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    pointer-events: none;
    z-index: 10
  }

  .hud button {
    pointer-events: auto;
  }

  .menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(14, 17, 22, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  pointer-events: auto;
}

.menu-panel {
  position: relative;
  background: #161b22;
  border: 1px solid #262c36;
  border-radius: 14px;
  padding: 28px;
  width: min(320px, 85vw);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.menu-panel h1 {
  margin: 0 0 4px;
  font-size: 20px;
  text-align: center;
}

.menu-group label {
  display: block;
  font-size: 13px;
  color: #9aa4b2;
  margin-bottom: 6px;
}

.btn-row { display: flex; gap: 8px; }

.mode-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #2c3542;
  background: #1c2128;
  color: #e9edf2;
  cursor: pointer;
}

.mode-btn.active {
  background: #6ee7b7;
  color: #0e1116;
  border-color: #6ee7b7;
  font-weight: 600;
}

.menu-group select,
.menu-group input[type="range"] {
  width: 100%;
}

.color-row { display: flex; gap: 16px; }
.color-row > div { flex: 1; }
.color-row input[type="color"] {
  width: 100%;
  height: 36px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
}

.play-btn {
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #6ee7b7;
  color: #0e1116;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}

.hud button {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid #2c3542;
  background: #1c2128;
  color: #e9edf2;
  cursor: pointer;
  font-size: 14px;
}

.secondary-btn {
  background: #1c2128;
  color: #e9edf2;
  border: 1px solid #2c3542;
}

.icon-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid #2c3542;
  background: #1c2128;
  color: #e9edf2;
  cursor: pointer;
}
.icon-btn:active { background: #262c36; }
.icon-btn:focus-visible { outline: 2px solid #6ee7b7; outline-offset: 2px; }

/* ---------- Loading screen ---------- */
#loader {
  position: fixed;
  inset: 0;
  z-index: 1000;              /* above every menu */
  background: #0e1116;        /* opaque from the first paint, so the dead menu never shows */
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .4s ease;
}
#loader.out { opacity: 0; pointer-events: none; }

/* Content stays hidden for 250ms so fast (cached) loads never flash it */
#loader .ld-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  opacity: 0;
  transition: opacity .3s ease;
}
#loader.show .ld-inner { opacity: 1; }

#ldCanvas {
  position: static;           /* beats the global canvas { position:absolute } rule */
  width: min(80vw, 440px);
  aspect-ratio: 22 / 7;
}
#ldText {
  margin: 0;
  font-size: 14px;
  color: #9aa4b2;
}
#loader.failed { cursor: pointer; }
#loader.failed #ldText { color: #e9edf2; }
</style>

</head>
<body>

  <!-- LOADING SCREEN: pure HTML/CSS/JS, does not depend on p5 or game.js -->
  <div id="loader" role="status" aria-live="polite">
    <div class="ld-inner">
      <canvas id="ldCanvas"></canvas>
      <p id="ldText">Loading…</p>
    </div>
  </div>
  <script>
  (function () {
    // Queen Bee Shuttle: a queen bee between two blocks. Repeats every 30
    // generations and never leaves this 22×7 box, so it loops seamlessly.
    var W = 22, H = 7;
    var seed = [[9,0],[7,1],[9,1],[6,2],[8,2],[5,3],[8,3],[6,4],[8,4],[7,5],[9,5],[9,6],
                [0,3],[1,3],[0,4],[1,4],[20,3],[21,3],[20,4],[21,4]];
    var LIVE = '#6ee7b7', DEAD = 'rgba(255,255,255,0.06)';

    var el = document.getElementById('loader');
    var text = document.getElementById('ldText');
    var cv = document.getElementById('ldCanvas');
    var ctx = cv.getContext('2d');

    function blank() {
      var g = [];
      for (var y = 0; y < H; y++) { g.push(new Array(W).fill(0)); }
      return g;
    }
    var grid = blank();
    seed.forEach(function (c) { grid[c[1]][c[0]] = 1; });

    // Same rules as the real game (B3/S23)
    function step() {
      var next = blank();
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var n = 0;
          for (var dy = -1; dy <= 1; dy++) {
            for (var dx = -1; dx <= 1; dx++) {
              if (dx || dy) {
                var yy = y + dy, xx = x + dx;
                if (yy >= 0 && yy < H && xx >= 0 && xx < W) n += grid[yy][xx];
              }
            }
          }
          next[y][x] = (n === 3 || (n === 2 && grid[y][x])) ? 1 : 0;
        }
      }
      grid = next;
    }

    function draw() {
      var dpr = window.devicePixelRatio || 1;
      var w = cv.clientWidth, h = cv.clientHeight;
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var s = w / W;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          ctx.fillStyle = grid[y][x] ? LIVE : DEAD;
          ctx.fillRect(x * s + 1, y * s + 1, s - 2, s - 2);
        }
      }
    }

    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var running = true, last = 0;
    draw();
    if (!reduce) {
      (function loop(t) {
        if (!running) return;
        if (t - last > 90) { step(); draw(); last = t; }   // ~11 generations per second
        requestAnimationFrame(loop);
      })(0);
    }

    // Reveal only if loading takes longer than 250ms, then keep it up for at least 900ms
    var shownAt = 0;
    var showTimer = setTimeout(function () { el.classList.add('show'); shownAt = Date.now(); }, 250);

    var done = false, failed = false;
    function fail() {
      if (done) return;
      failed = true;
      el.classList.add('show', 'failed');
      text.textContent = "Couldn't load. Tap to retry.";
    }
    var failTimer = setTimeout(fail, 20000);
    el.addEventListener('click', function () { if (failed) location.reload(); });

    window.loaderStage = function (msg) { if (!failed) text.textContent = msg; };
    window.loaderFail = fail;

    // Called at the end of setup(), once the menu buttons actually work
    window.hideLoader = function () {
      if (done) return;
      done = true;
      clearTimeout(failTimer);
      clearTimeout(showTimer);
      var wait = shownAt ? Math.max(0, 900 - (Date.now() - shownAt)) : 0;
      setTimeout(function () {
        el.classList.add('out');
        setTimeout(function () { running = false; el.remove(); }, 400);
      }, wait);
    };
  })();
  </script>

    <!-- MAIN MENU -->
  <div id="mainMenu" class="menu-overlay">
    <div class="menu-panel">
      <h1>The Game of Life</h1>
      <button id="newGameBtn" class="play-btn">New Game</button>
      <button id="resumeBtn" class="play-btn secondary-btn" style="display:none;">Resume Game</button>
      <button id="settingsBtn" class="play-btn secondary-btn">Settings</button>
    </div>
  </div>

  <!-- NEW GAME MENU -->
  <div id="newGameMenu" class="menu-overlay" style="display:none;">
    <div class="menu-panel">
      <h1>New Game</h1>

      <div class="menu-group">
        <label>Start Mode</label>
        <div class="btn-row">
          <button id="modeRandom" class="mode-btn active" data-mode="random">Random</button>
          <button id="modeBlank" class="mode-btn" data-mode="blank">Blank</button>
        </div>
      </div>

      <div class="menu-group">
        <label for="gridSize">Grid Size</label>
        <select id="gridSize">
          <option value="50">Small (50×50)</option>
          <option value="100" selected>Medium (100×100)</option>
          <option value="150">Large (150×150)</option>
        </select>
      </div>

      <button id="playBtn" class="play-btn">▶ Start Game</button>
      <button id="backFromNewGame" class="play-btn secondary-btn">Back</button>
    </div>
  </div>

  <!-- SETTINGS MENU -->
  <div id="settingsMenu" class="menu-overlay" style="display:none;">
    <div class="menu-panel">
      <h1>Settings</h1>

      <button id="installBtn" class="icon-btn" aria-label="Install or update the app" title="Install or update">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>
        </svg>
      </button>

      <div class="menu-group">
        <label for="speedSlider">Speed: <span id="speedVal">10</span> fps</label>
        <input type="range" id="speedSlider" min="1" max="60" value="10">
      </div>

      <div class="menu-group color-row">
        <div>
          <label for="cellColor">Cell Color</label>
          <input type="color" id="cellColor" value="#6ee7b7">
        </div>
        <div>
          <label for="bgColorInput">Background</label>
          <input type="color" id="bgColorInput" value="#0e1116">
        </div>
      </div>

      <p id="installHint" role="status" style="display:none; margin:0; font-size:13px; color:#9aa4b2; text-align:center;"></p>

      <button id="backFromSettings" class="play-btn secondary-btn">Back</button>
    </div>
  </div>

  <div class="hud" id="hud" style="display:none;">
    <button id="menuBtn">☰ Back to Menu</button>
    <button id="toggleRun">⏸ Pause</button>
  </div>

<script src="/p5.min.js" onload="loaderStage('Starting up…')" onerror="loaderFail()"></script>
<script src="/game.js" onerror="loaderFail()"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</body>
</html>
