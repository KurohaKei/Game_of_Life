<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Game of Life</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e1116">

<!-- iPhone ignores most of the manifest, so repeat it here -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Game of Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; color: #e9edf2;
               font: 16px system-ui, sans-serif; -webkit-user-select: none; user-select: none;
               touch-action: manipulation; overscroll-behavior: none; }
  #canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
         padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hud">
</div>

<script src="/game.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</body>
</html>
